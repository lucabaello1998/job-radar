name: Radar

# Corre todos los días a las 08:00 de Buenos Aires (11:00 UTC) y también a mano.
on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  actualizar:
    name: Relevar y publicar
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Tests
        run: |
          pip install pytest ruff
          ruff check jobradar tests
          ruff format --check jobradar tests
          python -m pytest -q

      - name: Correr el radar
        run: python -m jobradar.construir

      - name: Publicar si hubo cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs
          if git diff --cached --quiet; then
            echo "Sin cambios en esta corrida."
            exit 0
          fi
          git commit -m "radar: corrida $(date -u +%Y-%m-%d)"
          git push
